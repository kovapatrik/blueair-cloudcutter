[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blueair-cloudcutter"
version = "0.1.0"
description = "Local control and BLE provisioning for BlueAir AWS IoT purifiers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Patrik Kovalovszky" }]
keywords = ["blueair", "air-purifier", "esp32", "ble", "bluetooth", "jailbreak", "right-to-repair"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
  "Topic :: Security",
]
dependencies = [
  "bleak>=0.22",
  "cryptography>=42",
  "paho-mqtt>=2.1,<3",
  "protobuf>=7.36.2",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
capture = ["scapy>=2.5"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
blueair-cloudcutter = "blueair_cloudcutter.cli:main"

[project.urls]
Homepage = "https://github.com/kovapatrik/blueair-cloudcutter"
Writeup = "https://github.com/kovapatrik/blueair-cloudcutter/blob/main/WRITEUP.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blueair_cloudcutter = ["data/roots/*.pem", "data/fake_backend/*.json"]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = ["src/blueair_cloudcutter/protos/*_pb2.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
